[package]
name = "openai-agents-sdk"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Unofficial Rust port of the OpenAI Agents SDK: agents, tools, handoffs, guardrails, sessions, tracing, MCP"
license = "Apache-2.0"
repository = "https://github.com/ngocthach/openai-agents-rust"
homepage = "https://github.com/ngocthach/openai-agents-rust"
documentation = "https://docs.rs/openai-agents-sdk"
readme = "README.md"
keywords = ["openai", "agents", "llm", "ai", "mcp"]
categories = ["api-bindings", "asynchronous"]
exclude = ["plans/", ".claude/", ".github/"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
sqlite = ["dep:rusqlite"]
mcp = ["dep:rmcp"]
websocket = ["dep:tokio-tungstenite"]
realtime = ["dep:tokio-tungstenite", "dep:base64"]
voice = ["dep:base64", "dep:tokio-tungstenite", "reqwest/multipart"]
sandbox = ["dep:base64", "dep:portable-pty", "dep:sha2"]
encrypt = ["dep:chacha20poly1305", "dep:hkdf", "dep:sha2", "dep:base64", "dep:aes", "dep:cbc", "dep:hmac"]
redis = ["dep:redis"]
mongodb = ["dep:mongodb"]
sqlx = ["dep:sqlx"]

[dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
log = "0.4"
# Pins the aws-lc-rs crypto provider so rustls never panics when `ring` is also present.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "query", "rustls", "http2", "charset", "system-proxy"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "process", "fs"] }
tokio-stream = "0.1"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
rmcp = { version = "3", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"], optional = true }
# Optional dependencies for websocket-based features (realtime, voice, Responses WebSocket).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"], optional = true }
base64 = { version = "0.23", optional = true }
# Optional dependencies for EncryptedSession (feature `encrypt`).
chacha20poly1305 = { version = "0.11", optional = true }
hkdf = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
# Fernet-compatible encryption for EncryptedSession (feature `encrypt`).
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", features = ["alloc"], optional = true }
hmac = { version = "0.13", optional = true }
# Pseudo-terminal sessions for sandboxes (feature `sandbox`).
portable-pty = { version = "0.9", optional = true }
# Optional dependency for RedisSession (feature `redis`).
redis = { version = "1", default-features = false, features = ["tokio-comp", "aio"], optional = true }
# Optional dependency for MongoDBSession (feature `mongodb`).
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "rustls-tls-aws-lc", "dns-resolver"], optional = true }
# Optional dependency for SqlxSession on PostgreSQL / MySQL (feature `sqlx`).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "mysql", "any", "json", "chrono"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
tempfile = "3"

[[example]]
name = "mcp_stdio"
required-features = ["mcp"]

[[example]]
name = "sessions_sqlite"
required-features = ["sqlite"]

[[example]]
name = "responses_websocket"
required-features = ["websocket"]

[[example]]
name = "voice_static"
required-features = ["voice"]

[[example]]
name = "realtime_text"
required-features = ["realtime"]

[[example]]
name = "sessions_encrypted"
required-features = ["encrypt"]

[[example]]
name = "sandbox_local"
required-features = ["sandbox"]
