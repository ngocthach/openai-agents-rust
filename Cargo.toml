[package]
name = "openai-agents-sdk"
version = "0.9.1"
edition = "2024"
rust-version = "1.89"
description = "Unofficial Rust port of the OpenAI Agents SDK: agents, tools, handoffs, guardrails, sessions, tracing, MCP"
license = "Apache-2.0"
repository = "https://github.com/ngocthach/openai-agents-rust"
homepage = "https://github.com/ngocthach/openai-agents-rust"
documentation = "https://docs.rs/openai-agents-sdk"
readme = "README.md"
keywords = ["openai", "agents", "llm", "ai", "mcp"]
categories = ["api-bindings", "asynchronous"]
exclude = ["plans/", ".claude/", ".github/"]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["macros"]

[features]
default = []
macros = ["dep:openai-agents-sdk-macros"]
sqlite = ["dep:rusqlite"]
mcp = ["dep:rmcp", "dep:sha1"]
websocket = ["dep:tokio-tungstenite"]
realtime = ["dep:tokio-tungstenite", "dep:base64"]
voice = ["dep:base64", "dep:tokio-tungstenite"]
sandbox = ["dep:base64", "dep:portable-pty", "dep:tokio-tungstenite", "dep:tar", "dep:flate2", "dep:zip"]
encrypt = ["dep:hkdf", "dep:base64", "dep:aes", "dep:cbc", "dep:hmac"]
redis = ["dep:redis"]
mongodb = ["dep:mongodb"]
sqlx = ["dep:sqlx"]
# Per-provider authentication for the non-OpenAI endpoints reached by
# `extensions::models` (AWS SigV4 for Bedrock/SageMaker, Google OAuth for Vertex AI,
# IBM IAM for watsonx.ai).
provider-auth = ["dep:hmac", "dep:base64", "dep:aws-lc-rs"]

[dependencies]
openai-agents-sdk-macros = { version = "0.9.1", path = "macros", optional = true }
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
log = "0.4"
# Pins the aws-lc-rs crypto provider so rustls never panics when `ring` is also present.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "query", "rustls", "http2", "charset", "multipart", "system-proxy"] }
schemars = "1"
# Enforces `pattern` constraints when function-tool arguments are validated against their schema.
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "process", "fs"] }
tokio-stream = "0.1"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "v5"] }
rand = "0.9"
rusqlite = { version = "0.39", features = ["bundled", "hooks"], optional = true }
rmcp = { version = "3", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"], optional = true }
# Optional dependencies for websocket-based features (realtime, voice, Responses WebSocket).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"], optional = true }
base64 = { version = "0.23", optional = true }
# Optional dependencies for EncryptedSession (feature `encrypt`).
hkdf = { version = "0.13", optional = true }
sha2 = "0.11"
# Fernet-compatible encryption for EncryptedSession (feature `encrypt`).
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", features = ["alloc"], optional = true }
hmac = { version = "0.13", optional = true }
# RS256 signing of Google service-account JWTs (feature `provider-auth`). Already in the
# dependency tree as the rustls crypto provider, so the feature adds no new crates.
aws-lc-rs = { version = "1", optional = true }
# Pseudo-terminal sessions for sandboxes (feature `sandbox`).
portable-pty = { version = "0.9", optional = true }
# In-process archive validation and extraction for sandboxes (feature `sandbox`).
# All three are pure Rust: `tar` without `xattr`, `flate2` on its `miniz_oxide` backend and
# `zip` with DEFLATE only, so the feature still builds with no C toolchain.
tar = { version = "0.4", default-features = false, optional = true }
flate2 = { version = "1", optional = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2"], optional = true }
# Optional dependency for RedisSession (feature `redis`).
redis = { version = "1", default-features = false, features = ["tokio-comp", "aio"], optional = true }
# SHA-1 for MCP tool-name disambiguation hashes (parity with Python).
sha1 = { version = "0.11", optional = true }
# Optional dependency for MongoDBSession (feature `mongodb`).
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "rustls-tls-aws-lc", "dns-resolver"], optional = true }
# Optional dependency for SqlxSession on PostgreSQL / MySQL / SQLite (feature `sqlx`).
# `sqlx-sqlite` and `rusqlite` share one `libsqlite3-sys` 0.37, so both link the same C library.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "mysql", "sqlite", "any", "json", "chrono"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
env_logger = "0.11"
tempfile = "3"
# Builds the zip fixtures the sandbox archive tests validate against.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"

# Only the PTY signal-disposition test needs it: it has to set SIG_IGN in the test process to
# prove a PTY child does not inherit it.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[example]]
name = "mcp_stdio"
required-features = ["mcp"]

[[example]]
name = "sessions_sqlite"
required-features = ["sqlite"]

[[example]]
name = "responses_websocket"
required-features = ["websocket"]

[[example]]
name = "voice_static"
required-features = ["voice"]

[[example]]
name = "realtime_text"
required-features = ["realtime"]

[[example]]
name = "sessions_encrypted"
required-features = ["encrypt"]

[[example]]
name = "sandbox_local"
required-features = ["sandbox"]
